version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookipi
      POSTGRES_USER: bookipi
      POSTGRES_PASSWORD: bookipi
    ports:
      - "5432:5432"
    volumes:
      - bookipi_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  bookipi_pgdata:

